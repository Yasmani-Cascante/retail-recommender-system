# env-vars.yaml — variables de entorno PLANAS (no secretas) de retail-recommender
# ============================================================================
# FIX (18/09/2026): reconstruido tras un incidente de produccion.
#
# `gcloud run services update --set-env-vars X=Y` NO es aditivo: reemplaza
# TODO el bloque de variables planas por lo que le pases, y eso borro estas
# 34 variables al agregar solo GCS_BUCKET_NAME. Los secretos sobrevivieron
# porque van por --set-secrets (mecanismo separado, secretKeyRef).
#
# Este archivo es ahora la fuente de verdad versionable de las variables
# planas -- usalo con --env-vars-file en cada deploy en vez de listarlas a
# mano, para que esto no se pueda repetir. Es seguro tenerlo en el repo:
# no contiene secretos (esos siguen en Secret Manager, referenciados aparte
# en el comando de deploy con --set-secrets).
#
# Para agregar UNA variable sin arriesgarte a repetir el incidente:
#   gcloud run services update retail-recommender --region us-central1 \
#     --update-env-vars NUEVA_VAR=valor
# (--update-env-vars SI es aditivo/merge; --set-env-vars siempre reemplaza)
# ============================================================================
ENVIRONMENT: "production"
GOOGLE_PROJECT_ID: "retail-recommendations-449216"
SERVICE_NAME: "retail-recommender"
SERVICE_VERSION: "2.1.0"
REDIS_HOST: "redis-10287.c1.us-central1-2.gce.cloud.redislabs.com"
REDIS_PORT: "10287"
REDIS_SSL: "false"
USE_REDIS_CACHE: "true"
SHOPIFY_SHOP_URL: "ai-shoppings.myshopify.com"
DB_SSL: "true"
KB_CONTENT_VERSIONING: "true"
PROMETHEUS_METRICS_ENABLED: "true"
GCP_MONITORING_ENABLED: "true"
LOG_JSON_FORMAT: "true"
LOG_LEVEL: "INFO"
CLOUD_RUN_REGION: "us-central1"
ENABLE_INTENT_DETECTION: "true"
INTENT_CONFIDENCE_THRESHOLD: "0.7"
INTENT_DETECTION_LOGGING: "true"
ML_INTENT_ENABLED: "true"
ML_CONFIDENCE_THRESHOLD: "0.8"
ML_MODEL_PATH: "models/intent_classifier"
# R-8 (16/11/2026): los modelos LFM de claude_config.py estan retirados en OpenRouter (404
# "no longer available"). Con "false" el redactor y la reformulacion KB van directos a
# GPT-4o-mini (el modelo que ya respondia). Reversible. Ver DCT, R-8.
LFM_MCP_ENABLED: "false"
LFM_KB_ENABLED: "false"
LFM_COLBERT_ENABLED: "true"
COLBERT_SERVICE_URL: "https://retail-embedding-service-178362262166.us-central1.run.app"
VISUAL_SEARCH_ENABLED: "true"
KB_WEBHOOKS_ENABLED: "true"
EMBEDDING_AUTH_DISABLED: "false"
APP_PUBLIC_URL: "https://retail-recommender-178362262166.us-central1.run.app"
MINILM_INTENT_ENABLED: "true"
GPT4O_MINI_FALLBACK_ENABLED: "true"
FORCE_GPT4O_MINI_FALLBACK: "false"
# Paso 1 del plan de modelos (25/11/2026): modelo principal de OpenRouter POR USO. Antes
# los tres usos (y el calentamiento de arranque) compartian GPT4O_MINI_FALLBACK_CONFIG en
# claude_config.py. Los tres valores son el modelo de hoy: este cambio no altera el
# comportamiento. El paso 2 cambiara SOLO KB_REFORMULATION_LLM_MODEL (decision en
# DCT_Fidelidad_Reformulacion_KB_23112026.md, 7.13). Si una variable falta o esta vacia,
# el codigo usa openai/gpt-4o-mini y lo indica en el log (model_source=default).
# Paso 2 (26/11/2026): la reformulacion KB pasa a GPT-4.1-mini. Evidencia: fase de finalistas
# (DCT_Fidelidad_Reformulacion_KB_23112026.md, 7.13): 0 respuestas infieles que lleguen al cliente
# frente a 18 de GPT-4o-mini, controles 10 de 10 en es/en/fr, misma latencia; mismo prompt de produccion.
# El redactor y la busqueda visual NO cambian (no tienen bateria de fidelidad; R-8(b)).
KB_REFORMULATION_LLM_MODEL: "openai/gpt-4.1-mini"
PRODUCT_REDACTOR_LLM_MODEL: "openai/gpt-4o-mini"
VISUAL_SEARCH_MESSAGE_LLM_MODEL: "openai/gpt-4o-mini"
# R-32 M4 (27/11/2026): capa de rescate del enrutado de intencion con LLM (llm_intent_router.py).
# Solo actua en los mensajes que hoy acaban en el menu de ayuda; elige la pagina que los responde
# o los manda a la busqueda de productos. Evidencia y criterio: DCT_Fidelidad_Reformulacion_KB_23112026.md,
# 7.21-7.28 (prompt v3 medido con gpt-4.1-mini: 0 perdidas frente a hoy en 840 consultas).
# Para apagarla sin reconstruir: INTENT_ROUTER_ENABLED: "false" y desplegar solo la configuracion.
INTENT_ROUTER_ENABLED: "true"
INTENT_ROUTER_LLM_MODEL: "openai/gpt-4.1-mini"
INTENT_ROUTER_TIMEOUT_S: "3"
# Corte automatico (28/11/2026): tras 3 fallos SEGUIDOS (tiempo agotado o error) deja de llamar al LLM
# 60 s (menu al instante); luego una llamada de prueba decide si se reanuda. Por instancia.
INTENT_ROUTER_BREAKER_FAILURES: "3"
INTENT_ROUTER_BREAKER_COOLDOWN_S: "60"
GCS_BUCKET_NAME: "retail-recommendations-449216-tfidf-model"
RECS_VISUAL_POOL_BASE: "100"
RECS_MAX_ALTERNATIVES: "8"
RECS_VISUAL_FILTER_IN_SEARCH: "1"
# R-2 (16/11/2026): desactiva la capa 4 de la base de conocimiento (SimpleKnowledgeBase,
# contenido ficticio de plantilla). Sin respuesta real -> 404 / "sin respuesta", nunca datos
# inventados. Reversible: "true". Ver DCT_Alineacion_Venv_Diagnostico_Suite_16112026.md, R-2.
KB_ENABLE_FALLBACK: "false"
# R-13b (22/11/2026): KB_SYNC_LANGUAGES retirada. La sincronizacion de la base de conocimiento usa los
# idiomas PUBLICADOS en Shopify; el codigo ya no lee esta variable. Ver DCT_Frescura_Contenido_KB_20112026.md.
