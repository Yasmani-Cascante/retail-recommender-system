# env-vars.yaml — variables de entorno PLANAS (no secretas) de retail-recommender
# ============================================================================
# FIX (18/09/2026): reconstruido tras un incidente de produccion.
#
# `gcloud run services update --set-env-vars X=Y` NO es aditivo: reemplaza
# TODO el bloque de variables planas por lo que le pases, y eso borro estas
# 34 variables al agregar solo GCS_BUCKET_NAME. Los secretos sobrevivieron
# porque van por --set-secrets (mecanismo separado, secretKeyRef).
#
# Este archivo es ahora la fuente de verdad versionable de las variables
# planas -- usalo con --env-vars-file en cada deploy en vez de listarlas a
# mano, para que esto no se pueda repetir. Es seguro tenerlo en el repo:
# no contiene secretos (esos siguen en Secret Manager, referenciados aparte
# en el comando de deploy con --set-secrets).
#
# Para agregar UNA variable sin arriesgarte a repetir el incidente:
#   gcloud run services update retail-recommender --region us-central1 \
#     --update-env-vars NUEVA_VAR=valor
# (--update-env-vars SI es aditivo/merge; --set-env-vars siempre reemplaza)
# ============================================================================
