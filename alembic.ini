# ==============================================================================
# ALEMBIC CONFIGURATION -- Retail Recommender System
# ==============================================================================
#
# Fase: M5 -- Alembic Migrations
# Fecha: 2026-02-27
# Estrategia: Script-only (sin autogenerate, sin SQLAlchemy ORM)
#   -> Las migrations se escriben como SQL explicito en los scripts Python.
#   -> SQLAlchemy solo se usa para gestion de conexion y tracking de version.
#   -> asyncpg sigue siendo el driver de runtime de la aplicacion.
#
# IMPORTANTE -- URL de base de datos:
#   NO se configura sqlalchemy.url aqui.
#   Se construye dinamicamente en alembic/env.py desde variables de entorno:
#     DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME  (definidas en .env)
#   Esto garantiza que jamas se almacenen credenciales en archivos versionados.
#
# Uso basico:
#   alembic current              -> Ver version actual aplicada
#   alembic history --verbose    -> Ver historial de migrations
#   alembic upgrade head         -> Aplicar todas las migrations pendientes
#   alembic upgrade head --sql   -> Dry-run (genera SQL sin aplicarlo)
#   alembic downgrade -1         -> Revertir ultima migration
#   alembic stamp <revision>     -> Marcar version sin ejecutar DDL
#   alembic revision -m "desc"   -> Crear nueva migration
#
# Compatibilidad con Cloud SQL (futuro):
#   Solo cambiar DB_HOST en .env -> el resto funciona sin modificaciones.
# ==============================================================================

[alembic]
# Ubicacion de los scripts de migration (relativa a este archivo)
script_location = alembic

# Formato del nombre de archivo para nuevas revisions.
# Ejemplo: 0002_add_content_versioning.py
# %%(rev)s  -> ID de revision (hash corto generado por Alembic)
# %%(slug)s -> version "slug" del mensaje (-m "...") en minusculas con guiones bajos
file_template = %%(rev)s_%%(slug)s

# Truncar el slug del nombre de archivo a estos caracteres (evita nombres muy largos)
truncate_slug_length = 60

# Prepend el timestamp al nombre del archivo (false = usar solo rev+slug)
prepend_rev = false

# Codificacion del output de los scripts generados
output_encoding = utf-8

# IMPORTANTE: sqlalchemy.url NO VA AQUI
# La URL se construye en alembic/env.py desde variables de entorno.
# Dejar esta linea comentada deliberadamente.
# sqlalchemy.url = postgresql+asyncpg://user:pass@host/db


# ==============================================================================
# POST-WRITE HOOKS (opcional)
# ==============================================================================
# Hooks para formatear automaticamente los archivos generados.
# Deshabilitado por ahora para no agregar dependencias adicionales.
# Descomentar si se incorporan linters al CI/CD:
#
# [post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


# ==============================================================================
# LOGGING CONFIGURATION
# ==============================================================================
# SQLAlchemy en WARN para no llenar el output con queries internas de Alembic.
# Alembic en INFO para ver el progreso de migrations.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# WARN: Solo errores de SQLAlchemy (no mostrar queries de tracking interno)
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO: Mostrar progreso de migrations
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
