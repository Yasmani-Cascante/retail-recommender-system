# Configuracion de pytest PROPIA del embedding service (20/10/2026, E5 paso 1).
#
# Por que existe: pytest busca su configuracion subiendo desde la carpeta de
# los tests. Sin este fichero encontraria el pytest.ini de la raiz del repo
# (el del monolito: --cov, --strict-config, timeout...), que exige plugins que
# el entorno de este servicio no necesita. Con este fichero, la carpeta del
# servicio es la raiz de pytest (comprobado: rootdir pasa a ser esta carpeta).
#
# Ejecutar desde esta carpeta, con el entorno del servicio:
#     python -m pytest tests -q
[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
